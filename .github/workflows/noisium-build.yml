name: Build Noisium 2.3.0 (Minecraft 1.20–1.20.1)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/noisium-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Fabric + Forge JARs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Download pinned Noisium source
        run: |
          git clone https://github.com/Steveplays28/noisium.git noisium-src
          cd noisium-src
          git checkout 8cf451809eca7cfae1dd839edad96fc9092c4ef8

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: noisium-src/**/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1

      - name: Build all platforms
        working-directory: noisium-src
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean build

      - name: Upload compiled mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: Noisium-2.3.0-Minecraft-1.20-1.20.1
          path: |
            noisium-src/fabric/build/libs/*.jar
            noisium-src/forge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
