name: Colombiria Vulkan Engine - Phase 1

on:
  push:
    branches:
      - feature/colombiria-open-world
    paths:
      - "colombiria/**"
      - ".github/workflows/colombiria-beta1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Colombiria Vulkan arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated project branch
        uses: actions/checkout@v4
        with:
          ref: feature/colombiria-open-world
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android NDK, CMake and shader compiler
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1"
          sudo apt-get update
          sudo apt-get install -y glslc
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build Vulkan debug APK
        working-directory: colombiria
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload Vulkan APK
        uses: actions/upload-artifact@v4
        with:
          name: Colombiria-Vulkan-Phase1-Android
          path: colombiria/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
