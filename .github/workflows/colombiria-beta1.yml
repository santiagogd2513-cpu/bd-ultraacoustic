name: Colombiria Godot 4 - Phase 1

on:
  push:
    branches:
      - feature/colombiria-open-world
    paths:
      - "colombiria/**"
      - ".github/workflows/colombiria-beta1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export Colombiria Godot 4 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/colombiria-open-world
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components (without obsolete tools package)
        run: |
          set -euxo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Download Godot 4.4.1 and Android export templates
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          sudo install "$(find . -maxdepth 2 -type f -name 'Godot_v4.4.1-stable_linux.x86_64' | head -n 1)" /usr/local/bin/godot
          curl -L --fail --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          unzip -q templates.tpz -d templates
          cp templates/templates/* "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
      - name: Import and validate project
        working-directory: colombiria
        run: |
          godot --headless --editor --path . --quit
          godot --headless --path . --quit-after 3
      - name: Export Android APK
        working-directory: colombiria
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Colombiria-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Colombiria-Godot4-Phase1-Android
          path: colombiria/build/Colombiria-Android.apk
          if-no-files-found: error
          retention-days: 30
