name: Colombiria Beta 2 Android

on:
  push:
    branches:
      - feature/colombiria-open-world
    paths:
      - "colombiria/**"
      - ".github/workflows/colombiria-beta1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Colombiria Beta 1 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated project branch
        uses: actions/checkout@v4
        with:
          ref: feature/colombiria-open-world

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: colombiria
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Colombiria-Beta2-Android
          path: colombiria/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
